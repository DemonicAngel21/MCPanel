name: Bug report
description: Something in MCPanel does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not report security vulnerabilities here — see SECURITY.md."
  - type: input
    id: version
    attributes: { label: MCPanel version, placeholder: "0.1.0" }
    validations: { required: true }
  - type: input
    id: server
    attributes: { label: Server software and Minecraft version, placeholder: "Paper 1.21.11" }
  - type: textarea
    id: what
    attributes: { label: What happened, description: Steps to reproduce and what you expected }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from Settings → About → Logs. Remove anything private.
      render: text
