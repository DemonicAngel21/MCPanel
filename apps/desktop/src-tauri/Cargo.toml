[package]
name = "mcpanel-desktop"
description = "MCPanel desktop host (Tauri): wires the core, exposes the API over IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "mcpanel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mcpanel-core.workspace = true
mcpanel-api.workspace = true
mcpanel-db.workspace = true
mcpanel-platform.workspace = true
mcpanel-providers.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
regex.workspace = true
uuid.workspace = true

[lints]
workspace = true
