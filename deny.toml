# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
# v1 ships for Windows only (decision: Windows-first). Add targets when porting.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # proc-macro-error (unmaintained, not a vulnerability) is only reached through
  # Tauri's Linux GTK stack (glib-macros). Re-evaluate when Linux support starts.
  { id = "RUSTSEC-2024-0370", reason = "Linux-only transitive dependency of Tauri; unmaintained, no known vulnerability" },
]

[licenses]
version = 2
# Dependency licenses compatible with distributing MCPanel under the MIT License.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
